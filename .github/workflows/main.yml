name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix & Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # 1. إنشاء local.properties ومفاتيح احتياطية لمنع توقف البناء
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForBuild" >> local.properties
          echo "API_KEY=AIzaSyDummyKeyForBuild" >> local.properties

          # 2. إنشاء google-services.json احتياطي لو المشروع مربوط بـ Firebase
          if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
            PKG=$(grep -Eo '(namespace|applicationId)[[:space:]]*=?[[:space:]]*["'\''][^"'\'']+["'\'']' app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            PKG=${PKG:-"com.hagag.app"}
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "hagag-debug-project",
              "storage_bucket": "hagag-debug-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "$PKG" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForDebugBuild123456789" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. إنشاء أيقونة افتراضية لو أيقونة التطبيق غير مرفوعة
          if [ -d "app/src/main/res" ] && [ -z "$(find app/src/main/res -name 'ic_launcher*' 2>/dev/null)" ]; then
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            cat <<EOF > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@android:drawable/sym_def_app_icon"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 4. تشغيل البناء وحفظ النتيجة
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          EXIT_CODE=$?
          set -e

          # 5. إظهار السبب المباشر في صفحة Summary لو حدث خطأ في الكود
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ السبب المباشر لتوقف البناء:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(^e: |FAILURE:|What went wrong:|^\* |error:)" -A 6 build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hagag-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
