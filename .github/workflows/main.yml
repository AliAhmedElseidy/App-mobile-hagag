name: Build Android APK

on:
push:
branches: ["main"]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK
    uses: actions/setup-java@v5
    with:
      java-version: "17"
      distribution: "temurin"

  - name: Validate Gradle Wrapper
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f "./gradlew" ]; then
        echo "ERROR: gradlew was not found in the repository root."
        exit 1
      fi

      if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
        echo "ERROR: Gradle wrapper properties were not found."
        exit 1
      fi

      chmod +x ./gradlew

      echo "Gradle wrapper configuration:"
      grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      set -euo pipefail
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
        >/dev/null 2>&1 || true

  - name: Configure local Android SDK
    shell: bash
    run: |
      echo "sdk.dir=$ANDROID_HOME" > local.properties

  - name: Build Debug APK
    shell: bash
    run: |
      set -o pipefail
      ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: hagag-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7

  - name: Show build failure details
    if: failure()
    shell: bash
    run: |
      if [ -f build.log ]; then
        echo "## Build failure details" >> "$GITHUB_STEP_SUMMARY"
        echo '```text' >> "$GITHUB_STEP_SUMMARY"
        grep -E -A 6 \
          'FAILURE:|What went wrong:|Execution failed|Could not|error:' \
          build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"
      fi
