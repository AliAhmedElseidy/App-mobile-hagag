name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        - uses: android-actions/setup-android@v4
      - name: Prepare project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForBuild" >> local.properties
          echo "API_KEY=AIzaSyDummyKeyForBuild" >> local.properties

          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            if [ ! -f app/google-services.json ]; then
              echo "تنبيه: ملف Firebase غير موجود. لن يتم إنشاء ملف وهمي."
            fi
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hagag-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
